<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}ControlPlane Dashboard{% endblock %}</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; background: #0f1117; color: #e6e6e6; margin: 0; padding: 0; }
  header { background: #161925; padding: 12px 24px; border-bottom: 1px solid #2a2f3f; }
  header a { color: #7ea8ff; text-decoration: none; font-weight: 600; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #262b3a; font-size: 13px; }
  th { color: #9aa4bf; font-weight: 600; text-transform: uppercase; font-size: 11px; }
  tr:hover { background: #171b28; }
  a.reqlink { color: #7ea8ff; text-decoration: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .status-COMPLETED { background: #17351f; color: #6fd68f; }
  .status-FAILED { background: #3a1a1a; color: #ff8a8a; }
  .severity-NO_ACTION, .severity-LOW_RISK { background: #17351f; color: #6fd68f; }
  .severity-MEDIUM_RISK { background: #3a3319; color: #e8c96a; }
  .severity-HIGH_RISK, .severity-CRITICAL { background: #3a1a1a; color: #ff8a8a; }
  .trust-HIGH { background: #17351f; color: #6fd68f; }
  .trust-MEDIUM { background: #3a3319; color: #e8c96a; }
  .trust-LOW { background: #3a1a1a; color: #ff8a8a; }
  .panel { background: #161925; border: 1px solid #262b3a; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; }
  .panel h2 { margin-top: 0; font-size: 15px; color: #9aa4bf; text-transform: uppercase; letter-spacing: 0.05em; }
  .why { background: #14202e; border-left: 3px solid #7ea8ff; padding: 10px 14px; margin: 8px 0; font-size: 13px; }
  .mono { font-family: SFMono-Regular, Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  code { background: #1b2130; padding: 1px 5px; border-radius: 4px; }
  .note { color: #7d879e; font-size: 12px; }
</style>
</head>
<body>
<header><a href="/dashboard">ControlPlane Dashboard</a> <span class="note">-- read-only, reflects state at page load, not a live stream</span></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
