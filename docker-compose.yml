services:
  postgres:
    image: postgres:16-alpine
    container_name: controlplane_postgres
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controlplane_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - controlplane_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane -d controlplane"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  controlplane_pgdata:
